<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - Sandwiches</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 20px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 6px 0 0;
  color: #d1d5db;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 6px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  font-size: 17px;
  border: 1px solid #d1d5db;
  border-radius: 9px;
}

textarea {
  resize: vertical;
}

.note {
  color: #6b7280;
  font-size: 14px;
  margin-top: -5px;
}

.option-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.option-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
}

.option-name {
  font-weight: bold;
  flex: 1;
}

.option-row.selected {
  background: #eff6ff;
  border-color: #2563eb;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 8px;
}

.quantity button {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 8px;
  font-size: 22px;
  font-weight: bold;
  background: #2563eb;
  color: white;
}

.quantity span {
  width: 25px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

.bread-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 9px;
}

.bread {
  padding: 15px 10px;
  border: 2px solid #e5e7eb;
  background: #f9fafb;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

.bread.selected {
  background: #2563eb;
  border-color: #2563eb;
  color: white;
}

.add-button {
  width: 100%;
  padding: 17px;
  border: 0;
  border-radius: 10px;
  background: #16a34a;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.clear-button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #6b7280;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 10px;
}

.order-item {
  border: 1px solid #d1d5db;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  background: #f9fafb;
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.order-title {
  font-size: 18px;
  font-weight: bold;
}

.order-details {
  margin-top: 8px;
  line-height: 1.5;
  font-size: 15px;
}

.order-buttons {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}

.small-button {
  border: 0;
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 16px;
  font-weight: bold;
}

.plus {
  background: #16a34a;
  color: white;
}

.minus {
  background: #dc2626;
  color: white;
}

.delete {
  background: #374151;
  color: white;
}

.print-button {
  width: 100%;
  padding: 17px;
  border: 0;
  border-radius: 10px;
  background: #111827;
  color: white;
  font-size: 18px;
  font-weight: bold;
  margin-top: 10px;
}

.empty {
  text-align: center;
  color: #6b7280;
  padding: 15px;
}

.section-title {
  margin-top: 25px;
  margin-bottom: 10px;
  font-size: 20px;
}

#printArea {
  display: none;
}

@media(max-width:500px) {
  .bread-list {
    grid-template-columns: 1fr;
  }
}

@media print {

  body {
    background: white;
  }

  body > * {
    display: none !important;
  }

  #printArea {
    display: block !important;
    width: 100%;
    padding: 8px;
    font-family: monospace;
    font-size: 14px;
    color: black;
  }

  #printArea h1 {
    text-align: center;
    font-size: 20px;
  }

  #printArea hr {
    border: 0;
    border-top: 1px dashed black;
    margin: 10px 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>🥪 PEDIDOS</h1>
  <p>Crear sándwich personalizado</p>
</header>

<div class="container">

<!-- CLIENTE -->

<div class="card">

<h2>👤 Cliente</h2>

<label>Nombre</label>
<input id="customerName" type="text" placeholder="Nombre del cliente">

<label>Teléfono</label>
<input id="customerPhone" type="tel" placeholder="Teléfono">

</div>


<!-- PAN -->

<div class="card">

<h2>🥖 1. Pan</h2>

<p class="note">Selecciona un solo tipo de pan.</p>

<div class="bread-list">

<button class="bread" onclick="selectBread('Pan blanco', this)">
Pan blanco
</button>

<button class="bread" onclick="selectBread('Pan integral', this)">
Pan integral
</button>

<button class="bread" onclick="selectBread('Bagel', this)">
Bagel
</button>

<button class="bread" onclick="selectBread('Hero', this)">
Hero
</button>

<button class="bread" onclick="selectBread('Roll', this)">
Roll
</button>

<button class="bread" onclick="selectBread('Rey Bread', this)">
Rey Bread
</button>

<button class="bread" onclick="selectBread('Arpa', this)">
Arpa
</button>

</div>

</div>


<!-- QUESO -->

<div class="card">

<h2>🧀 2. Queso</h2>

<p class="note">
Usa + y − para indicar la cantidad.
</p>

<div id="cheeseList" class="option-list"></div>

</div>


<!-- CARNE -->

<div class="card">

<h2>🥩 3. Carne</h2>

<div id="meatList" class="option-list"></div>

</div>


<!-- HUEVOS -->

<div class="card">

<h2>🍳 4. Huevos</h2>

<div id="eggList" class="option-list"></div>

</div>


<!-- SALSAS -->

<div class="card">

<h2>🥫 5. Salsas</h2>

<div id="sauceList" class="option-list"></div>

</div>


<!-- VEGETALES -->

<div class="card">

<h2>🥬 6. Vegetales</h2>

<div id="vegetableList" class="option-list"></div>

</div>


<!-- NOTAS -->

<div class="card">

<h2>📝 Notas del sándwich</h2>

<textarea
id="sandwichNotes"
rows="3"
placeholder="Ejemplo: cortar a la mitad, salsa aparte..."
></textarea>

</div>


<!-- AGREGAR -->

<div class="card">

<button class="add-button" onclick="addSandwich()">
➕ AGREGAR SÁNDWICH AL PEDIDO
</button>

<button class="clear-button" onclick="clearCurrentSandwich()">
🔄 LIMPIAR SÁNDWICH ACTUAL
</button>

</div>


<!-- PEDIDO -->

<div class="card">

<h2>🧾 Pedido actual</h2>

<div id="orderList">
<div class="empty">
Todavía no hay sándwiches.
</div>
</div>

<button class="print-button" onclick="printOrder()">
🖨️ IMPRIMIR PEDIDO COMPLETO
</button>

</div>

</div>


<div id="printArea"></div>


<script>

const menu = {

  cheese: [
    "Cheddar",
    "Mozzarella",
    "American Cheese",
    "Swiss Cheese",
    "Pepper Jack",
    "Provolone",
    "Queso Fresco"
  ],

  meat: [
    "Turkey",
    "Bacon",
    "Roast Beef",
    "Breakfast Sausage",
    "Breakfast Ham",
    "Deli Ham",
    "Chorizo",
    "Spicy Chorizo",
    "Steak",
    "Salami",
    "Cappi Ham",
    "Pepperoni",
    "Pastrami",
    "Bologna"
  ],

  eggs: [
    "Eggs",
    "Egg Whites",
    "Over Medium",
    "Over Easy"
  ],

  sauce: [
    "Red Hot Sauce",
    "Green Hot Sauce",
    "Ketchup",
    "Mayo",
    "Mustard",
    "Chipotle Mayo",
    "Oil and Vinegar"
  ],

  vegetables: [
    "Tomato",
    "Red Onions",
    "White Onions",
    "Sweet Peppers",
    "Jalapeños",
    "Avocado"
  ]

};


let currentSandwich = {

  bread: "",

  cheese: {},
  meat: {},
  eggs: {},
  sauce: {},
  vegetables: {},

  notes: ""

};


let order = [];


let orderNumber =
  Number(localStorage.getItem("orderNumber") || 0) + 1;


localStorage.setItem(
  "orderNumber",
  orderNumber
);


/* CREAR OPCIONES */

function createOptions(
  list,
  containerId,
  category
) {

  const container =
    document.getElementById(containerId);

  container.innerHTML = "";

  list.forEach(function(item) {

    const row =
      document.createElement("div");

    row.className = "option-row";

    row.id =
      "row-" + category + "-" +
      item.replace(/\s+/g, "-");


    const name =
      document.createElement("div");

    name.className = "option-name";

    name.textContent = item;


    const quantity =
      document.createElement("div");

    quantity.className = "quantity";


    const minus =
      document.createElement("button");

    minus.textContent = "−";

    minus.onclick = function() {

      changeQuantity(
        category,
        item,
        -1
      );

    };


    const number =
      document.createElement("span");

    number.id =
      "quantity-" +
      category +
      "-" +
      item.replace(/\s+/g, "-");

    number.textContent = "0";


    const plus =
      document.createElement("button");

    plus.textContent = "+";

    plus.onclick = function() {

      changeQuantity(
        category,
        item,
        1
      );

    };


    quantity.appendChild(minus);
    quantity.appendChild(number);
    quantity.appendChild(plus);


    row.appendChild(name);
    row.appendChild(quantity);


    container.appendChild(row);

  });

}


/* CANTIDADES */

function changeQuantity(
  category,
  item,
  change
) {

  if (!currentSandwich[category][item]) {

    currentSandwich[category][item] = 0;

  }


  currentSandwich[category][item] += change;


  if (
    currentSandwich[category][item] < 0
  ) {

    currentSandwich[category][item] = 0;

  }


  if (
    currentSandwich[category][item] > 10
  ) {

    currentSandwich[category][item] = 10;

  }


  const number =
    document.getElementById(
      "quantity-" +
      category +
      "-" +
      item.replace(/\s+/g, "-")
    );


  if (number) {

    number.textContent =
      currentSandwich[category][item];

  }


  const row =
    document.getElementById(
      "row-" +
      category +
      "-" +
      item.replace(/\s+/g, "-")
    );


  if (row) {

    if (
      currentSandwich[category][item] > 0
    ) {

      row.classList.add("selected");

    } else {

      row.classList.remove("selected");

    }

  }

}


/* PAN */

function selectBread(
  bread,
  button
) {

  currentSandwich.bread =
    bread;


  document
    .querySelectorAll(".bread")
    .forEach(function(btn) {

      btn.classList.remove("selected");

    });


  button.classList.add("selected");

}


/* CREAR IDENTIFICADOR */

function sandwichKey(
  sandwich
) {

  return JSON.stringify({

    bread: sandwich.bread,

    cheese: sandwich.cheese,

    meat: sandwich.meat,

    eggs: sandwich.eggs,

    sauce: sandwich.sauce,

    vegetables: sandwich.vegetables,

    notes: sandwich.notes

  });

}


/* AGREGAR SÁNDWICH */

function addSandwich() {

  if (!currentSandwich.bread) {

    alert(
      "Primero selecciona el pan."
    );

    return;

  }


  currentSandwich.notes =
    document
      .getElementById("sandwichNotes")
      .value
      .trim();


  const newKey =
    sandwichKey(currentSandwich);


  const existing =
    order.find(function(item) {

      return item.key === newKey;

    });


  if (existing) {

    existing.quantity++;

  } else {

    order.push({

      key: newKey,

      quantity: 1,

      sandwich:
        JSON.parse(
          JSON.stringify(currentSandwich)
        )

    });

  }


  renderOrder();

  clearCurrentSandwich();

}


/* MOSTRAR PEDIDO */

function renderOrder() {

  const container =
    document.getElementById("orderList");


  if (order.length === 0) {

    container.innerHTML =
      '<div class="empty">Todavía no hay sándwiches.</div>';

    return;

  }


  container.innerHTML = "";


  order.forEach(function(item, index) {

    const sandwich =
      item.sandwich;


    const div =
      document.createElement("div");

    div.className =
      "order-item";


    let details =
      "<strong>Pan:</strong> " +
      sandwich.bread +
      "<br>";


    details +=
      formatCategory(
        "Queso",
        sandwich.cheese
      );


    details +=
      formatCategory(
        "Carne",
        sandwich.meat
      );


    details +=
      formatCategory(
        "Huevos",
        sandwich.eggs
      );


    details +=
      formatCategory(
        "Salsas",
        sandwich.sauce
      );


    details +=
      formatCategory(
        "Vegetales",
        sandwich.vegetables
      );


    if (sandwich.notes) {

      details +=
        "<strong>Notas:</strong> " +
        escapeHTML(
          sandwich.notes
        ) +
        "<br>";

    }


    div.innerHTML = `

      <div class="order-header">

        <div class="order-title">
          ${item.quantity} × Sándwich
        </div>

      </div>

      <div class="order-details">
        ${details}
      </div>

      <div class="order-buttons">

        <button
          class="small-button plus"
          onclick="increaseOrder(${index})">
          +
        </button>

        <button
          class="small-button minus"
          onclick="decreaseOrder(${index})">
          −
        </button>

        <button
          class="small-button delete"
          onclick="deleteOrder(${index})">
          Eliminar
        </button>

      </div>

    `;


    container.appendChild(div);

  });

}


/* FORMATO DE INGREDIENTES */

function formatCategory(
  title,
  items
) {

  const selected =
    Object.entries(items)
      .filter(function(entry) {

        return entry[1] > 0;

      })
      .map(function(entry) {

        return (
          escapeHTML(entry[0]) +
          " × " +
          entry[1]
        );

      });


  if (selected.length === 0) {

    return (
      "<strong>" +
      title +
      ":</strong> Ninguno<br>"
    );

  }


  return (
    "<strong>" +
    title +
    ":</strong> " +
    selected.join(", ") +
    "<br>"
  );

}


/* + DEL PEDIDO */

function increaseOrder(index) {

  order[index].quantity++;

  renderOrder();

}


/* − DEL PEDIDO */

function decreaseOrder(index) {

  order[index].quantity--;


  if (
    order[index].quantity <= 0
  ) {

    order.splice(index, 1);

  }


  renderOrder();

}


/* ELIMINAR */

function deleteOrder(index) {

  order.splice(index, 1);

  renderOrder();

}


/* LIMPIAR */

function clearCurrentSandwich() {

  currentSandwich = {

    bread: "",

    cheese: {},
    meat: {},
    eggs: {},
    sauce: {},
    vegetables: {},

    notes: ""

  };


  document
    .querySelectorAll(".bread")
    .forEach(function(button) {

      button.classList.remove("selected");

    });


  document
    .querySelectorAll(".option-row")
    .forEach(function(row) {

      row.classList.remove("selected");

    });


  document
    .querySelectorAll(".quantity span")
    .forEach(function(span) {

      span.textContent = "0";

    });


  document.getElementById(
    "sandwichNotes"
  ).value = "";

}


/* SEGURIDAD */

function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* IMPRIMIR */

function printOrder() {

  if (order.length === 0) {

    alert(
      "Agrega por lo menos un sándwich."
    );

    return;

  }


  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const now =
    new Date();


  let html = `

    <h1>PEDIDO #${orderNumber}</h1>

    <hr>

    <strong>CLIENTE:</strong><br>
    ${escapeHTML(name || "Sin nombre")}<br><br>

    <strong>TELÉFONO:</strong><br>
    ${escapeHTML(phone || "Sin teléfono")}<br>

    <hr>

  `;


  order.forEach(function(item, index) {

    const sandwich =
      item.sandwich;


    html += `

      <strong>
        ${item.quantity} × SÁNDWICH
      </strong><br>

      Pan: ${escapeHTML(
        sandwich.bread
      )}<br>

    `;


    html +=
      printCategory(
        "Queso",
        sandwich.cheese
      );


    html +=
      printCategory(
        "Carne",
        sandwich.meat
      );


    html +=
      printCategory(
        "Huevos",
        sandwich.eggs
      );


    html +=
      printCategory(
        "Salsas",
        sandwich.sauce
      );


    html +=
      printCategory(
        "Vegetales",
        sandwich.vegetables
      );


    if (sandwich.notes) {

      html +=
        "Notas: " +
        escapeHTML(
          sandwich.notes
        ) +
        "<br>";

    }


    html += "<br><hr>";

  });


  document.getElementById(
    "printArea"
  ).innerHTML = html;


  window.print();

}


/* CATEGORÍAS PARA IMPRESIÓN */

function printCategory(
  title,
  items
) {

  const selected =
    Object.entries(items)
      .filter(function(entry) {

        return entry[1] > 0;

      });


  if (selected.length === 0) {

    return "";

  }


  let text =
    title + ": ";


  text +=
    selected
      .map(function(entry) {

        return (
          escapeHTML(entry[0]) +
          " × " +
          entry[1]
        );

      })
      .join(", ");


  return text + "<br>";

}


/* INICIAR OPCIONES */

createOptions(
  menu.cheese,
  "cheeseList",
  "cheese"
);

createOptions(
  menu.meat,
  "meatList",
  "meat"
);

createOptions(
  menu.eggs,
  "eggList",
  "eggs"
);

createOptions(
  menu.sauce,
  "sauceList",
  "sauce"
);

createOptions(
  menu.vegetables,
  "vegetableList",
  "vegetables"
);

renderOrder();

</script>

</body>
</html>
