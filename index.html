<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba WiFi Browser Print POS</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:30px;color:#222}
  .box{max-width:600px;margin:40px auto;background:white;border-radius:18px;padding:28px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
  h1{font-size:28px;margin-top:0}
  .info{background:#f1f1f1;border-radius:12px;padding:16px;line-height:1.7;margin:20px 0}
  button{width:100%;padding:18px;border:0;border-radius:12px;background:#1769e0;color:white;font-size:20px;font-weight:bold;cursor:pointer}
  .small{font-size:14px;color:#666;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h1>🖨️ Prueba mínima</h1>
  <p>Esta página envía un trabajo de prueba mínimo a WiFi Browser Print POS.</p>

  <div class="info">
    <strong>Impresora:</strong> 192.168.1.28<br>
    <strong>Puerto:</strong> 9100<br>
    <strong>Título:</strong> TEST<br>
    <strong>Contenido:</strong><br>
    PRUEBA WIFI PRINT<br>
    HOLA DESDE IPAD
  </div>

  <button id="printButton">🖨️ ENVIAR PRUEBA</button>

  <div class="small">
    Safari puede preguntar si quieres abrir “WiFi Browser Print POS”.<br>
    Toca <strong>Abrir</strong>.
  </div>
</div>

<script>
function enviarPrueba(){
  const printData = {
    printerIp: "192.168.1.28",
    title: "TEST",
    content: [
      "PRUEBA WIFI PRINT",
      "HOLA DESDE IPAD"
    ]
  };

  try {
    const json = JSON.stringify(printData);

    // Base64 del JSON UTF-8.
    const base64 = btoa(unescape(encodeURIComponent(json)));

    // Protocolo documentado por WiFi Browser Print POS.
    const printUrl = "wbprint://" + base64;

    // Navegación directa desde el toque del usuario.
    window.location.href = printUrl;
  } catch(error) {
    alert("Error preparando la prueba: " + error.message);
    console.error(error);
  }
}

document.getElementById("printButton").addEventListener("click", enviarPrueba);
</script>
</body>
</html>
